<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checker NIK Hacker Theme</title>
<style>
body {
  background-color: #000;
  color: #0f0;
  font-family: 'Courier New', monospace;
  text-align: center;
  padding: 20px;
}
.container {
  border: 2px solid #0f0;
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 0 20px #0f0;
  display: inline-block;
}
input {
  width: 90%;
  padding: 10px;
  background: #000;
  color: #0f0;
  border: 1px solid #0f0;
  border-radius: 5px;
  margin: 10px 0;
  text-align: center;
}
button {
  background: #0f0;
  color: #000;
  border: none;
  padding: 10px 20px;
  border-radius: 5px;
  font-weight: bold;
  cursor: pointer;
}
button:hover {
  background: #00ff80;
}
.result {
  border: 1px solid #0f0;
  padding: 10px;
  border-radius: 10px;
  margin-top: 15px;
  text-align: left;
}
</style>
</head>
<body>
<div class="container">
  <h2>Checker NIK Hacker Theme</h2>
  <p>Masukkan NIK (16 digit) lalu klik <b>Parse</b></p>
  <input type="text" id="nik" maxlength="16" placeholder="Masukkan NIK...">
  <br>
  <button onclick="parseNIK()">Parse</button>
  <button onclick="document.getElementById('nik').value='';document.getElementById('result').innerHTML=''">Clear</button>
  <div id="result" class="result"></div>
</div>

<script>
async function parseNIK(){
  const nik = document.getElementById('nik').value.trim();
  const resultBox = document.getElementById('result');
  if(nik.length !== 16){
    resultBox.innerHTML = "<p>⚠️ NIK harus 16 digit!</p>";
    return;
  }

  // Ekstraksi tanggal lahir
  let day = parseInt(nik.substr(6,2));
  let month = parseInt(nik.substr(8,2));
  let year = parseInt(nik.substr(10,2));
  const gender = day > 40 ? "Perempuan" : "Laki-laki";
  if(day > 40) day -= 40;

  const currentYear = new Date().getFullYear() % 100;
  let fullYear = (year <= currentYear) ? 2000 + year : 1900 + year;
  const birthDate = `${day.toString().padStart(2,'0')}-${month.toString().padStart(2,'0')}-${fullYear}`;
  
  // Ambil kode daerah
  const provCode = nik.substr(0,2);
  const kabCode = nik.substr(0,4);
  const kecCode = nik.substr(0,6);

  // Panggil API wilayah Emsifa
  try {
    const [provRes, kabRes, kecRes] = await Promise.all([
      fetch("https://emsifa.github.io/api-wilayah-indonesia/api/provinces.json").then(r=>r.json()),
      fetch(`https://emsifa.github.io/api-wilayah-indonesia/api/regencies/${provCode}.json`).then(r=>r.json()),
      fetch(`https://emsifa.github.io/api-wilayah-indonesia/api/districts/${kabCode}.json`).then(r=>r.json())
    ]);

    const prov = provRes.find(p => p.id.startsWith(provCode))?.name || "-";
    const kab = kabRes.find(k => k.id.startsWith(kabCode))?.name || "-";
    const kec = kecRes.find(kc => kc.id.startsWith(kecCode))?.name || "-";

    resultBox.innerHTML = `
      🆔 NIK: ${nik}<br>
      🏙️ Provinsi: ${prov}<br>
      🏡 Kabupaten: ${kab}<br>
      📍 Kecamatan: ${kec}<br>
      📅 Tanggal Lahir: ${birthDate}<br>
      🚻 Jenis Kelamin: ${gender}
    `;
  } catch(e){
    resultBox.innerHTML = "❌ Gagal memuat data wilayah.";
  }
}
</script>
</body>
</html>
