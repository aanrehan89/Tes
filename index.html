<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checker NIK — Hacker Theme</title>
<style>
body {
  background-color: #000;
  color: #00ff00;
  font-family: "Courier New", monospace;
  text-align: center;
  padding: 20px;
}
.container {
  border: 2px solid #00ff00;
  border-radius: 10px;
  padding: 20px;
  box-shadow: 0 0 30px #00ff00;
  display: inline-block;
  max-width: 400px;
}
input {
  background: #000;
  border: 1px solid #00ff00;
  color: #00ff00;
  padding: 10px;
  width: 90%;
  text-align: center;
  border-radius: 5px;
}
button {
  background: #00ff00;
  color: #000;
  border: none;
  padding: 10px 20px;
  margin: 10px 5px;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
}
.result {
  margin-top: 20px;
  text-align: left;
}
.error {
  color: #ff3333;
}
</style>
</head>
<body>
  <div class="container">
    <h2>Checker NIK — Hacker Theme</h2>
    <p>Masukkan NIK (16 digit) lalu klik <b>Parse</b></p>
    <input type="text" id="nik" maxlength="16" placeholder="Masukkan NIK">
    <div>
      <button onclick="parseNIK()">Parse</button>
      <button onclick="clearResult()">Clear</button>
   <div id="loading" class="loading" style="display:none;">sabar yaa</div>
    </div>
    <div id="result" class="result"></div>
  </div>

  <script>
  async function parseNIK() {
    const nik = document.getElementById("nik").value.trim();
    const resultDiv = document.getElementById("result");
    if (nik.length !== 16) {
      resultDiv.innerHTML = '<p class="error">⚠️ NIK harus 16 digit!</p>';
      return;
    }

    const kodeProv = nik.substring(0, 2);
    const kodeKab = nik.substring(2, 4);
    const kodeKec = nik.substring(4, 6);
    const tgl = parseInt(nik.substring(6, 8));
    const bln = parseInt(nik.substring(8, 10));
    const thn = parseInt(nik.substring(10, 12));

    let tahun = thn + 2000;
    const now = new Date();
    if (tahun > now.getFullYear()) tahun -= 100;

    let tanggal = tgl > 40 ? tgl - 40 : tgl;
    const gender = tgl > 40 ? "Perempuan" : "Laki-laki";
    const umur = now.getFullYear() - tahun - 
      ((now.getMonth() + 1 < bln || (now.getMonth() + 1 === bln && now.getDate() < tanggal)) ? 1 : 0);
    
    // Pakai proxy untuk bypass CORS
    const proxy = "https://api.allorigins.win/raw?url=";
    const baseURL = "https://emsifa.github.io/api-wilayah-indonesia/api";
    
    try {
      const provData = await fetch(`${proxy}${baseURL}/provinces.json`).then(res => res.json());
      const prov = provData.find(p => p.id.startsWith(kodeProv)) || {};
      
      let kab = {}, kec = {};
      if (prov.id) {
        const kabData = await fetch(`${proxy}${baseURL}/regencies/${prov.id}.json`).then(res => res.json());
        kab = kabData.find(k => k.id.substring(2,4) === kodeKab) || {};

        if (kab.id) {
          const kecData = await fetch(`${proxy}${baseURL}/districts/${kab.id}.json`).then(res => res.json());
          kec = kecData.find(k => k.id.substring(4,6) === kodeKec) || {};
        }
      }

      resultDiv.innerHTML = `
        <p><b>ID</b>: ${nik}</p>
        <p>Provinsi: ${prov.name || '-'}</p>
        <p>Kabupaten/Kota: ${kab.name || '-'}</p>
        <p>Kecamatan: ${kec.name || '-'}</p>
        <p>Tanggal Lahir: ${tanggal.toString().padStart(2, '0')}-${bln.toString().padStart(2, '0')}-${tahun}</p>
        <p>Jenis Kelamin: ${gender}</p>
        <p>Umur: ${umur} tahun</p>
        <hr>
        <small>Library: internal • API wilayah: emsifa + proxy allorigins</small>
      `;
    } catch (e) {
      resultDiv.innerHTML = `<p class="error">❌ Gagal memuat data wilayah.<br>(${e.message})</p>`;
    }
  }

  function clearResult() {
    document.getElementById("nik").value = "";
    document.getElementById("result").innerHTML = "";
  }
  </script>
</body>
</html>
