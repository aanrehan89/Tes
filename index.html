<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek NIK SIDALIH</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
      margin: 0 auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .result {
      background: white;
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: none;
    }
    .error {
      color: red;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>🔍 Cek Data NIK SIDALIH</h2>
  <form id="nikForm">
    <label for="nik">Masukkan NIK:</label>
    <input type="number" id="nik" name="nik" placeholder="Contoh: 320101xxxxxxxxxx" required>
    <button type="submit">Cek Sekarang</button>
  </form>

  <div id="error" class="error"></div>

  <div id="result" class="result">
    <h3>Hasil Pencarian:</h3>
    <p><strong>Nama:</strong> <span id="nama"></span></p>
    <p><strong>NIK:</strong> <span id="nikOut"></span></p>
    <p><strong>NKK:</strong> <span id="nkk"></span></p>
    <p><strong>Provinsi:</strong> <span id="provinsi"></span></p>
    <p><strong>Kabupaten:</strong> <span id="kabupaten"></span></p>
    <p><strong>Kecamatan:</strong> <span id="kecamatan"></span></p>
    <p><strong>Kelurahan:</strong> <span id="kelurahan"></span></p>
    <p><strong>TPS:</strong> <span id="tps"></span></p>
    <p><strong>Alamat:</strong> <span id="alamat"></span></p>
  </div>

  <script>
    const form = document.getElementById('nikForm');
    const resultBox = document.getElementById('result');
    const errorBox = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nik = document.getElementById('nik').value.trim();
      if (!nik) return alert('Masukkan NIK terlebih dahulu!');

      resultBox.style.display = 'none';
      errorBox.textContent = 'Memproses...';

      try {
        const query = {
          query: `
            {
              findNikSidalih (
                nik:"${nik}",
                wilayah_id:0,
                token:"əBjdb_00cAFcWeA&bc7Q3MHoCV-4m_ʌɴXA_hnmQp24TɢNgfqdEtUFslaKscWʍ_YphWrsK83swgrPpwDxOCkNuWksTpsBt0kOngbKWItDYWmjiQhrzKD3AaAsNZCJCqFJbs6_tPZ5Gh8ir8B4cAoLLrqIVkYxh1c8xxTP-zXFWXjLerYQqT7oEZ1NF9ybyEvj-7FIuALw9XUMz_5tavAsqWgSTP_gID1l0mYUUT0IaVKwq_PNZYrprM6xvczwRBmWjsX7K9CFGx9aBDLNn1ZUljvWLR7l3u3qmqJUZpJhGjOEalyOSy7x8lSq3W_62tRVEt5yAHst7-iyn1ZVfllwJFyJ6Tt8IryCf4nx-4Z9eJw2uvcWkrMt_APEogG7KysQUNyZ_GGiPOqujSRbraf93AOXa-TW4574XNorCFoAO4-m9fJql9Wbo_ZDmSZGkLvY1n5TXC9HxH-QIR7lM_TCGLvAfo6--Lz7dUqtZz-2g2kjev-E-0hEwhCU0mSEkFzDr2uqTUmIDq0Lx4rmyylYmUR_B0Ftoh5dNn8YsdiOAaFUOCKiNbcMWZfhBX5RJMF7jwV6Ioa8nwefEISZC8lbekaX8_jRAC1qNMACmT6WtjAHi0eWreKg2C8s-frJQMBmiKEItSenWaFTNP1JvYI_zgoIsU6XgwEqw2nocg3tC2MUE_Q54AFFq6R964hixbUkuO23rVqGePgbE4KxvtlCz5LP1bG0N5OWFwwquxRFRocdyqgW_vSxv04VVV2UFGTrluj_LDPCBUBPuSn63949yoSGNkPTICQq46MTUixbSFyc3h8nzGXe5NP96FIiS7nw6IrwatFj4BiRs9Q00rzyip6H0oIvYPzpJfp5xewiC7I_x86FtL2cFw40a_t8"
              ){
                nama,
                nik,
                nkk,
                provinsi,
                kabupaten,
                kecamatan,
                kelurahan,
                tps,
                alamat
              }
            }
          `
        };

        const res = await fetch("https://cekdptonline.kpu.go.id/v2", {
          method: "POST",
          headers: {
            "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 18_6_0 like Mac OS X)",
            "Accept": "application/json, text/plain, */*",
            "Content-Type": "application/json;charset=utf-8",
            "Origin": "https://cekdptonline.kpu.go.id",
            "Referer": "https://cekdptonline.kpu.go.id/"
          },
          body: JSON.stringify(query)
        });

        const data = await res.json();
        const hasil = data?.data?.findNikSidalih;

        if (!hasil) {
          errorBox.textContent = "❌ Data tidak ditemukan atau NIK salah.";
          return;
        }

        errorBox.textContent = '';
        resultBox.style.display = 'block';
        document.getElementById('nama').textContent = hasil.nama || '-';
        document.getElementById('nikOut').textContent = hasil.nik || '-';
        document.getElementById('nkk').textContent = hasil.nkk || '-';
        document.getElementById('provinsi').textContent = hasil.provinsi || '-';
        document.getElementById('kabupaten').textContent = hasil.kabupaten || '-';
        document.getElementById('kecamatan').textContent = hasil.kecamatan || '-';
        document.getElementById('kelurahan').textContent = hasil.kelurahan || '-';
        document.getElementById('tps').textContent = hasil.tps || '-';
        document.getElementById('alamat').textContent = hasil.alamat || '-';

      } catch (err) {
        console.error(err);
        errorBox.textContent = "⚠️ Gagal memuat data, coba lagi nanti.";
      }
    });
  </script>
</body>
