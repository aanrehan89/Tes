<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Parse NIK</title>

<style>
:root{
  --bg:#0b0f14;
  --card:#111827;
  --border:#1f2937;
  --accent:#22c55e;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --danger:#ef4444;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  display:flex;
  justify-content:center;
  padding:20px;
}

.app{
  width:100%;
  max-width:420px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

/* Card */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
}

/* Header */
.header{
  text-align:center;
}
.header h1{
  margin:0;
  font-size:20px;
  color:var(--accent);
}
.header p{
  margin:6px 0 0;
  font-size:13px;
  color:var(--muted);
}

/* Input */
.input-group input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#020617;
  color:var(--text);
  text-align:center;
  font-size:15px;
}
.input-group input:focus{
  outline:none;
  border-color:var(--accent);
}

/* Buttons */
.actions{
  display:flex;
  gap:10px;
}
button{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:600;
}
.btn-primary{
  background:var(--accent);
  color:#022c22;
}
.btn-secondary{
  background:#020617;
  color:var(--muted);
  border:1px solid var(--border);
}

/* Result */
.result{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}
.item{
  background:#020617;
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 12px;
}
.item span{
  display:block;
  font-size:11px;
  color:var(--muted);
}
.item b{
  font-size:14px;
}

.loading{
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.error{
  color:var(--danger);
  font-size:13px;
  white-space:pre-wrap;
}
.footer{
  text-align:center;
  font-size:11px;
  color:var(--muted);
}
a{color:var(--accent);text-decoration:none}
</style>
</head>

<body>
<div class="app">

  <!-- Header -->
  <div class="card header">
    <h1>Parse NIK</h1>
    <p>ZXZ CYBER TEAM</p>
  </div>

  <!-- Input -->
  <div class="card input-group">
    <input id="nik" maxlength="16" placeholder="Masukkan NIK (16 digit)">
  </div>

  <!-- Actions -->
  <div class="card actions">
    <button class="btn-primary" id="btnParse">Parse</button>
    <button class="btn-secondary" id="btnClear">Clear</button>
  </div>

  <!-- Status -->
  <div id="loading" class="loading" style="display:none">Mengambil data wilayah…</div>

  <!-- Result -->
  <div id="result" class="result"></div>

  <!-- Footer -->
  <div class="footer">
    Join WhatsApp Channel  
    <a href="https://whatsapp.com/channel/0029VaPOrs9InlqL4QVs293c" target="_blank">klik di sini</a>
  </div>

</div>

<script>
/* ===== JS LU TETAP, CUMA OUTPUT DIGANTI CARD ===== */

const baseAPI="https://emsifa.github.io/api-wilayah-indonesia/api";
const proxyFallback="https://api.codetabs.com/v1/proxy?quest=";

btnParse.onclick=parseNIK;
btnClear.onclick=()=>{nik.value="";result.innerHTML="";};

function showLoading(v){loading.style.display=v?"block":"none";}

function parseDateFromNIK(n){
  const t=parseInt(n.slice(6,8));
  const b=parseInt(n.slice(8,10));
  let y=parseInt(n.slice(10,12))+2000;
  if(y>new Date().getFullYear())y-=100;
  return{
    t:t>40?t-40:t,
    b,y,
    g:t>40?"Perempuan":"Laki-laki",
    u:new Date().getFullYear()-y
  };
}

async function fetchJSON(u){
  try{
    const r=await fetch(u);
    if(!r.ok)throw"err";
    return r.json();
  }catch{
    return fetchJSON(proxyFallback+encodeURIComponent(u));
  }
}

async function parseNIK(){
  const v=nik.value.trim();
  if(!/^\d{16}$/.test(v)){
    result.innerHTML='<div class="error">NIK harus 16 digit angka</div>';
    return;
  }

  showLoading(true);
  result.innerHTML="";

  const d=parseDateFromNIK(v);
  const p=await fetchJSON(`${baseAPI}/provinces.json`);
  const prov=p.find(x=>x.id.startsWith(v.slice(0,2)))||{};
  const kab=prov.id?(await fetchJSON(`${baseAPI}/regencies/${prov.id}.json`)).find(x=>x.id.slice(2,4)==v.slice(2,4))||{}:{};
  const kec=kab.id?(await fetchJSON(`${baseAPI}/districts/${kab.id}.json`)).find(x=>x.id.slice(4,6)==v.slice(4,6))||{}:{};

  showLoading(false);

  result.innerHTML=`
    <div class="item"><span>NIK</span><b>${v}</b></div>
    <div class="item"><span>Provinsi</span><b>${prov.name||"-"}</b></div>
    <div class="item"><span>Kabupaten</span><b>${kab.name||"-"}</b></div>
    <div class="item"><span>Kecamatan</span><b>${kec.name||"-"}</b></div>
    <div class="item"><span>Tanggal Lahir</span><b>${d.t}-${d.b}-${d.y}</b></div>
    <div class="item"><span>Jenis Kelamin</span><b>${d.g}</b></div>
    <div class="item"><span>Umur</span><b>${d.u} tahun</b></div>
  `;
}
</script>
</body>
</html>
