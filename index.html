<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Parser NIK Online</title>
  <style>
    body {
      font-family: Poppins, sans-serif;
      background: linear-gradient(135deg, #2196f3, #00bcd4);
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
    }
    button {
      background: #2196f3;
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1976d2; }
    #hasil {
      margin-top: 15px;
      background: #f8f8f8;
      border-radius: 10px;
      padding: 12px;
      text-align: left;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Parser NIK Otomatis</h2>
    <input id="nik" placeholder="Masukkan NIK 16 digit" maxlength="16">
    <button onclick="parseNIK()">Parse</button>
    <div id="hasil">Hasil akan muncul di sini...</div>
  </div>

  <script>
    async function parseNIK() {
      const nik = document.getElementById("nik").value.trim();
      const hasilDiv = document.getElementById("hasil");

      if (nik.length !== 16 || isNaN(nik)) {
        hasilDiv.innerHTML = "<span style='color:red'>Masukkan NIK valid 16 digit!</span>";
        return;
      }

      try {
        // Ganti URL di bawah dengan API parser GitHub pilihanmu
        const res = await fetch(`https://raw.githubusercontent.com/agusID/NIK-Parser-API/main/api.php?nik=${nik}`);
        const data = await res.json();

        hasilDiv.innerHTML = `
          <b>Provinsi:</b> ${data.provinsi}<br>
          <b>Kab/Kota:</b> ${data.kabupaten_kota}<br>
          <b>Kecamatan:</b> ${data.kecamatan}<br>
          <b>Tanggal Lahir:</b> ${data.tanggal_lahir}<br>
          <b>Jenis Kelamin:</b> ${data.jenis_kelamin}
        `;
      } catch (e) {
        hasilDiv.innerHTML = "<span style='color:red'>Gagal mengambil data. Coba lagi!</span>";
      }
    }
  </script>
</body>
</html>
