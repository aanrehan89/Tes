<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title> PARSE NIK (with robust fallback)</title>
<style>
body{background:#000;color:#00ff00;font-family:"Courier New",monospace;text-align:center;padding:20px}
.container{border:2px solid #00ff00;border-radius:10px;padding:20px;box-shadow:0 0 30px #00ff00;display:inline-block;max-width:420px}
input{background:#000;border:1px solid #00ff00;color:#00ff00;padding:10px;width:90%;text-align:center;border-radius:5px}
button{background:#00ff00;color:#000;border:none;padding:10px 20px;margin:10px 5px;border-radius:5px;cursor:pointer;font-weight:700}
.loading{color:#00ff00;margin-top:10px;font-style:italic}
.result{margin-top:20px;text-align:left}
.error{color:#ff3333;white-space:pre-wrap}
.small{font-size:12px;color:#99ff99}
a{color:#00ff00}
</style>
</head>
<body>
  <div class="container">
    <h2>Parse NIK By Aan Rehan </h2>
    <p>Masukkan NIK (16 digit) lalu klik <b>Parse</b></p>
    <input id="nik" maxlength="16" placeholder="Masukkan NIK (contoh: 3321120809040004)">
    <div>
      <button id="btnParse">Parse</button>
      <button id="btnClear">Clear</button>
    </div>
    <div id="loading" class="loading" style="display:none">Mengambil data...</div>
    <div id="result" class="result"></div>
  </div>

<script>
const baseAPI = "https://emsifa.github.io/api-wilayah-indonesia/api";
const proxyFallback = "https://api.codetabs.com/v1/proxy?quest="; // fallback proxy (encode URL)

document.getElementById("btnParse").addEventListener("click", parseNIK);
document.getElementById("btnClear").addEventListener("click", clearResult);

function showLoading(show){
  document.getElementById("loading").style.display = show ? "block" : "none";
}

function showError(msg){
  document.getElementById("result").innerHTML = `<p class="error">❌ Gagal memuat data wilayah.\n(${msg})</p>`;
}

function clearResult(){
  document.getElementById("nik").value = "";
  document.getElementById("result").innerHTML = "";
}

function parseDateFromNIK(nik){
  const tglRaw = parseInt(nik.substring(6,8),10);
  const bln = parseInt(nik.substring(8,10),10);
  let thn = parseInt(nik.substring(10,12),10) + 2000;
  const now = new Date();
  if(thn > now.getFullYear()) thn -= 100;
  const tanggal = tglRaw > 40 ? tglRaw - 40 : tglRaw;
  const gender = tglRaw > 40 ? "Perempuan" : "Laki-laki";
  const umur = now.getFullYear() - thn - ((now.getMonth()+1 < bln || (now.getMonth()+1 === bln && now.getDate() < tanggal)) ? 1 : 0);
  return {tanggal,bln,thn,gender,umur};
}

async function tryFetchJSON(url){
  // helper yang mem-try fetch dan memeriksa response.ok
  const res = await fetch(url);
  if(!res.ok) {
    const text = await res.text().catch(()=>"<no body>");
    throw new Error(`HTTP ${res.status} ${res.statusText} — body: ${text}`);
  }
  // attempt parse JSON
  return res.json();
}

async function fetchWithFallback(path){
  // 1) coba langsung
  try {
    return await tryFetchJSON(`${baseAPI}/${path}`);
  } catch (errDirect) {
    console.warn("Direct fetch failed:", errDirect);
    // 2) coba proxy fallback (encode target)
    try {
      const target = encodeURIComponent(`${baseAPI}/${path}`);
      return await tryFetchJSON(`${proxyFallback}${target}`);
    } catch (errProxy) {
      console.warn("Proxy fetch failed:", errProxy);
      // gabungkan info supaya bisa debugging
      throw new Error(`Direct error: ${errDirect.message}\nProxy error: ${errProxy.message}`);
    }
  }
}

async function parseNIK(){
  const nik = document.getElementById("nik").value.trim();
  const resultDiv = document.getElementById("result");
  resultDiv.innerHTML = "";
  if(nik.length !== 16 || !/^\d{16}$/.test(nik)){
    resultDiv.innerHTML = '<p class="error">⚠️ NIK harus 16 digit angka!</p>';
    return;
  }

  // If page opened via file:// warn user — many browsers restrict cross-origin
  if(location.protocol === "file:"){
    resultDiv.innerHTML = `<p class="error">⚠️ Halaman dibuka dari berkas lokal (file://).<br>
    Beberapa browser memblokir request jaringan dari file lokal. Silakan jalankan melalui server HTTP (contoh di PC: <code>python -m http.server</code>) atau upload ke layanan hosting (Vercel/GitHub Pages).</p>
    <p class="small">Jika tetap ingin melanjutkan, script akan mencoba fallback proxy — tapi server/Browser mungkin tetap menolak.</p>`;
    // don't return here — we continue and attempt fetch (but user informed)
  }

  showLoading(true);

  const kodeProv = nik.substring(0,2);
  const kodeKab = nik.substring(2,4);
  const kodeKec = nik.substring(4,6);

  const d = parseDateFromNIK(nik);

  try {
    const provList = await fetchWithFallback("provinces.json");
    // find prov: id mulai dengan kodeProv (emsifa ids like "33")
    const prov = (provList && provList.find(p => p.id.startsWith(kodeProv))) || {};
    let kab = {}, kec = {};

    if(prov.id){
      const kabData = await fetchWithFallback(`regencies/${prov.id}.json`);
      kab = (kabData && kabData.find(k => k.id.substring(2,4) === kodeKab)) || {};
      if(kab.id){
        const kecData = await fetchWithFallback(`districts/${kab.id}.json`);
        kec = (kecData && kecData.find(k => k.id.substring(4,6) === kodeKec)) || {};
      }
    }

    showLoading(false);

    resultDiv.innerHTML = `
      <p><b>NIK:</b> ${nik}</p>
      <p><b>Provinsi:</b> ${prov.name || '-'}</p>
      <p><b>Kabupaten/Kota:</b> ${kab.name || '-'}</p>
      <p><b>Kecamatan:</b> ${kec.name || '-'}</p>
      <p><b>Tanggal Lahir:</b> ${String(d.tanggal).padStart(2,'0')}-${String(d.bln).padStart(2,'0')}-${d.thn}</p>
      <p><b>Jenis Kelamin:</b> ${d.gender}</p>
      <p><b>Umur:</b> ${d.umur} tahun</p>
      <hr>
      <p class="small"> Terimakasih sudah menggunakan website kami, jangan lupa join saluran WhatsApp</p>
      <p class="small">saluran saya: <a href="https://whatsapp.com/channel/0029VaPOrs9InlqL4QVs293c" target="_blank"> klik </a></p>
    `;
  } catch (e) {
    showLoading(false);
    console.error("Final fetch error:", e);
    // tampilkan message berguna
    let msg = e.message || String(e);
    // kalau origin null, beri petunjuk local server
    if(location.protocol === "file:"){
      msg += "\n\nCatatan: kamu membuka file via file:// — jalankan melalui web server agar fetch berjalan. Contoh:\n1) PC: buka folder file di terminal lalu jalankan `python -m http.server` lalu buka http://localhost:8000\n2) Upload ke GitHub Pages / Vercel\n3) Di Android: pakai Termux dan jalankan `python -m http.server`, lalu buka http://127.0.0.1:8000 di browser";
    } else {
      msg += "\n\nJika internet aktif dan tetap gagal, coba buka console DevTools untuk detail (F12 / Inspect) atau deploy file ke hosting (Vercel/GitHub Pages).";
    }
    showError(msg);
  }
}
</script>
</body>
</html>
