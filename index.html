<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parse NIK</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">

    <div class="card header">
    <h1>Parse NIK</h1>
    <p>ZXZ CYBER TEAM</p>
  </div>


    <div class="card">
      <input id="nik" maxlength="16" placeholder="Masukkan NIK (16 digit)">
    </div>

    <div class="card actions">
      <button id="btnParse">Parse</button>
      <button id="btnClear">Clear</button>
    </div>

    <div id="loading" class="loading" hidden>Mengambil data…</div>
    <div id="result" class="result"></div>

  </div>

  <script src="app.js"></script>
</body>
</html>
