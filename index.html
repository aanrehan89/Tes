<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parser NIK Otomatis</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #00b4db, #0083b0);
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }
    h2 {
      margin-bottom: 10px;
      color: #111;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
    }
    button {
      background: #00b4db;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #0093c4;
    }
    #hasil {
      margin-top: 15px;
      background: #f9f9f9;
      border-radius: 10px;
      padding: 10px;
      text-align: left;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔍 Parser NIK Otomatis</h2>
    <input id="nik" placeholder="Masukkan NIK 16 digit" maxlength="16" />
    <button onclick="parseNIK()">Parse Sekarang</button>
    <div id="hasil">Hasil akan muncul di sini...</div>
  </div>

  <script>
    async function parseNIK() {
      const nik = document.getElementById("nik").value.trim();
      const hasilDiv = document.getElementById("hasil");

      if (nik.length !== 16 || isNaN(nik)) {
        hasilDiv.innerHTML = "<span style='color:red'>Masukkan NIK valid (16 digit)!</span>";
        return;
      }

      hasilDiv.innerHTML = "⏳ Sedang memproses...";

      try {
        const res = await fetch(`https://api.emfisa.com/nik/${nik}`);
        if (!res.ok) throw new Error("Gagal ambil data");

        const data = await res.json();
        if (data && data.data) {
          const d = data.data;
          hasilDiv.innerHTML = `
            <b>Provinsi:</b> ${d.provinsi}<br>
            <b>Kab/Kota:</b> ${d.kabupaten_kota}<br>
            <b>Kecamatan:</b> ${d.kecamatan}<br>
            <b>Tanggal Lahir:</b> ${d.tanggal_lahir}<br>
            <b>Jenis Kelamin:</b> ${d.jenis_kelamin}
          `;
        } else {
          hasilDiv.innerHTML = "<span style='color:red'>NIK tidak ditemukan atau format salah.</span>";
        }
      } catch (e) {
        hasilDiv.innerHTML = "<span style='color:red'>Gagal menghubungi API Emfisa.</span>";
      }
    }
  </script>
</body>
</html>
